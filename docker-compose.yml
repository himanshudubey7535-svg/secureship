services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: secureship
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/secureship
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      TRIVY_TIMEOUT: ${TRIVY_TIMEOUT:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REPORTS_DIR: /app/reports
      SCAN_RATE_LIMIT_PER_HOUR: ${SCAN_RATE_LIMIT_PER_HOUR:-20}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-2}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-100000}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets Trivy scan locally built images
      - trivy_cache:/root/.cache/trivy               # keeps the vulnerability DB between runs
      - reports_data:/app/reports

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mysql_data:
  trivy_cache:
  reports_data:
