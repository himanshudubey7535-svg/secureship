services:
  # 1. FastAPI Backend Service (Docker with Python + Trivy Scanner)
  - type: web
    name: secureship-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./secureship.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # 2. Vite React Frontend (Static Site - Global CDN)
  - type: web
    name: secureship-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: secureship-backend
          envVarKey: RENDER_EXTERNAL_URL
